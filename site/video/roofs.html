<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><title>superDOTats · teulades</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000}
#st{position:relative;width:1280px;height:720px;overflow:hidden;background:#000;font-family:"Helvetica Neue",Arial,sans-serif}
#bg{position:absolute;left:-60px;top:-32px;width:1400px;height:783px;transform-origin:50% 60%}
.d{position:absolute;left:0;top:0;transform-origin:50% 95%;will-change:transform}
.dsp-shadow{display:none}
.sh{position:absolute;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,20,0,.55),rgba(60,20,0,0))}
#tag{position:absolute;left:0;right:0;top:92px;text-align:center;color:#fff;text-shadow:0 4px 30px rgba(120,30,0,.6)}
#tag h2{margin:0;font-size:96px;font-weight:700;letter-spacing:-.05em;line-height:1}

#grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,150,70,.16),rgba(150,50,130,.22));mix-blend-mode:soft-light;pointer-events:none;z-index:6}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}

</style></head><body>
<div id="st"><img id="bg" src="roofs-bg.jpg" alt=""><div id="sun"></div><div id="vig"></div><div id="layer"></div><div id="fx"></div><div id="grade"></div>
</div>
<script>
const MANIFEST = {"bodies":{"blob":{"w":480,"h":434,"eyeL":0.3645,"eyeR":0.631,"eyeY":0.423,"headW":0.8042,"headL":0.0958},"arch":{"w":480,"h":618,"eyeL":0.3607,"eyeR":0.6376,"eyeY":0.3675,"headW":0.7708,"headL":0.1125},"cube":{"w":480,"h":479,"eyeL":0.3358,"eyeR":0.6634,"eyeY":0.4228,"headW":0.8083,"headL":0.0938}},"items":{"hats-antenna":{"w":192,"h":420},"hats-chef":{"w":420,"h":343},"hats-cowboy":{"w":420,"h":258},"hats-crown":{"w":420,"h":346},"hats-flower":{"w":420,"h":406},"hats-graduation":{"w":420,"h":292},"hats-hardhat":{"w":420,"h":347},"hats-party":{"w":296,"h":420},"hats-tophat":{"w":420,"h":351},"hats-wizard":{"w":408,"h":420},"glasses-shades":{"w":420,"h":151},"accessories-bowtie":{"w":420,"h":239},"accessories-mustache":{"w":420,"h":139},"accessories-tie":{"w":197,"h":420}},"tones":["pink","orange","yellow","green","teal","blue","violet","slate"]};



const BODIES = ['blob', 'arch', 'cube'];
const TONES = ['pink', 'orange', 'yellow', 'green', 'teal', 'blue', 'violet', 'slate'];
const TONE_COLORS = { pink: '#ff4d7d', orange: '#ff8a3d', yellow: '#ffc21a', green: '#7cd13b', teal: '#19c3a6', blue: '#2f7bff', violet: '#7a4cf0', slate: '#52657a' };
const SPRITE_ITEMS = {
  hat: ['none', 'tophat', 'crown', 'party', 'cowboy', 'wizard', 'chef', 'graduation', 'hardhat', 'antenna', 'flower'],
  glasses: ['none', 'shades'],
  accessory: ['none', 'bowtie', 'tie', 'mustache'],
};
const DEFAULT_SPRITE_LOOK = { body: 'blob', tone: 'violet', hat: 'none', glasses: 'none', accessory: 'none' };
const FOLDER = { hat: 'hats', glasses: 'glasses', accessory: 'accessories' };

// [width as a share of the head width, how far the hat sinks into the head as a share of body height]
const HAT = {
  tophat: [0.82, 0.12], crown: [0.74, 0.12], party: [0.58, 0.08], cowboy: [1.32, 0.18],
  wizard: [1.0, 0.11], chef: [0.94, 0.15], graduation: [1.08, 0.18], hardhat: [1.0, 0.2], antenna: [0.3, 0.06], flower: [0.4, -0.02],
};

function normalizeSpriteLook(look) {
  const l = look || {};
  const pick = (v, list, d) => (list.includes(v) ? v : d);
  return {
    body: pick(l.body, BODIES, DEFAULT_SPRITE_LOOK.body),
    tone: pick(l.tone, TONES, DEFAULT_SPRITE_LOOK.tone),
    hat: pick(l.hat, SPRITE_ITEMS.hat, 'none'),
    glasses: pick(l.glasses, SPRITE_ITEMS.glasses, 'none'),
    accessory: pick(l.accessory, SPRITE_ITEMS.accessory, 'none'),
  };
}

function isSpriteLook(look) {
  return !!look && BODIES.includes(look.body);
}

const pct = (v) => `${(v * 100).toFixed(2)}%`;

/** Layout of a Dot inside a square frame (all numbers are shares of the frame). */
function spriteLayout(look) {
  const l = normalizeSpriteLook(look);
  const B = MANIFEST.bodies[l.body];
  let bh = 0.58;
  let bw = (bh * B.w) / B.h;
  if (bw > 0.84) { bw = 0.84; bh = (bw * B.h) / B.w; }
  const left = (1 - bw) / 2;
  const top = 1 - 0.05 - bh;
  const fx = (f) => left + f * bw;
  const fy = (f) => top + f * bh;
  return { l, B, bw, bh, left, top, fx, fy, eyeCx: fx((B.eyeL + B.eyeR) / 2), eyeY: fy(B.eyeY), eyeGap: (B.eyeR - B.eyeL) * bw, headW: B.headW * bw };
}

function itemBox(cat, name, w) {
  const meta = MANIFEST.items[`${FOLDER[cat]}-${name}`];
  if (!meta) return null;
  return { w, h: (w * meta.h) / meta.w, x: 0, y: 0 };
}

/** Every layer of a Dot as {src, x, y, w, h, z, cls}; positions are shares of the square frame. */
function spriteParts(look) {
  const g = spriteLayout(look);
  const { l } = g;
  const out = [];
  const add = (cat, name, box, z, cls) => {
    if (box) out.push({ src: cat === 'body' ? `bodies/${name}.webp` : `items/${FOLDER[cat]}-${name}.webp`, x: box.x, y: box.y, w: box.w, h: box.h, z, cls });
  };
  const cx = g.eyeCx;
  const ey = g.eyeY;
  const hw = g.headW;
  const place = (cat, name, w, anchorY, dy, dx = 0) => {
    const b = itemBox(cat, name, w);
    if (!b) return null;
    b.x = cx + dx - w / 2;
    b.y = ey + dy - b.h * anchorY;
    return b;
  };
  add('body', `${l.body}-${l.tone}`, { x: g.left, y: g.top, w: g.bw, h: g.bh }, 2, 'body');
  const A = {
    bowtie: () => place('accessory', 'bowtie', hw * 0.44, 0.5, g.bh * 0.3),
    tie: () => place('accessory', 'tie', hw * 0.28, 0, g.bh * 0.17),
    mustache: () => place('accessory', 'mustache', hw * 0.44, 0.5, g.bh * 0.12),
  };
  if (A[l.accessory]) add('accessory', l.accessory, A[l.accessory](), 4, 'acc');
  if (l.glasses !== 'none') {
    const gap = g.eyeGap;
    const mk = (w, anchorY, dx) => place('glasses', l.glasses, w, anchorY, 0, dx);
    let box;
    box = mk(gap * 2.15, 0.5, 0);
    add('glasses', l.glasses, box, 5, 'gl');
  }
  if (l.hat !== 'none') {
    const [wf, sink] = HAT[l.hat];
    const w = hw * wf;
    const b = itemBox('hat', l.hat, w);
    if (b) {
      const flower = l.hat === 'flower';
      b.x = cx + (flower ? hw * 0.3 : 0) - w / 2;
      b.y = g.top + sink * g.bh + (flower ? g.bh * 0.1 : 0) - b.h;
      add('hat', l.hat, b, 6, 'hat');
    }
  }
  return { parts: out, g };
}

/** HTML for a plush Dot. `size` is the frame size in px; `base` is where /dots/ is served. */
function dotSprite(look, size = 96, label = 'Dot', base = '/dots/') {
  const { parts, g } = spriteParts(look);
  const html = parts.map((p) => `<img class="dsp-${p.cls}" src="${base}${p.src}" alt="" draggable="false" style="left:${pct(p.x)};top:${pct(p.y)};width:${pct(p.w)};height:${pct(p.h)};z-index:${p.z}">`).join('');
  const safe = String(label).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  return `<span class="dsp" role="img" aria-label="${safe}" style="--s:${size}px"><span class="dsp-all">${html}</span><span class="dsp-shadow" style="left:${pct(g.left + g.bw * 0.1)};width:${pct(g.bw * 0.8)};top:${pct(g.top + g.bh - 0.012)}"></span></span>`;
}

const SPRITE_CSS = `
.dsp{position:relative;display:inline-block;width:var(--s,96px);height:var(--s,96px);flex:none;line-height:0}
.dsp-all{position:absolute;inset:0;display:block;transform-origin:50% 95%}
.dsp img{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none;max-width:none}
.dsp-shadow{position:absolute;height:5%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),rgba(0,0,0,0));z-index:0}
.dl .dsp-all{animation:dl-breathe var(--dl-speed,3.6s) ease-in-out var(--dl-delay,0s) infinite}
.dl[data-state=happy] .dsp-all{animation:dl-hop .55s cubic-bezier(.2,.8,.3,1)}
.dl[data-state=sleepy] .dsp-all{animation:dl-breathe 6s ease-in-out infinite}
.dl[data-state=talking] .dsp-all{animation:dl-talk-body .32s ease-in-out infinite}
.dl[data-state=thinking] .dsp-all{animation:dl-think 2.4s ease-in-out infinite}
@keyframes dl-talk-body{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes dl-think{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
`;

function ensureSpriteStyles() {
  if (typeof document === 'undefined' || document.getElementById('dot-sprite-css')) return;
  const style = document.createElement('style');
  style.id = 'dot-sprite-css';
  style.textContent = SPRITE_CSS;
  document.head.appendChild(style);
}

function randomSpriteLook() {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  return {
    body: pick(BODIES), tone: pick(TONES),
    hat: Math.random() < 0.85 ? pick(SPRITE_ITEMS.hat.slice(1)) : 'none',
    glasses: Math.random() < 0.5 ? pick(SPRITE_ITEMS.glasses.slice(1)) : 'none',
    accessory: Math.random() < 0.6 ? pick(SPRITE_ITEMS.accessory.slice(1)) : 'none',
  };
}

(function(){
var BASE="../dots/";ensureSpriteStyles();
var T=10,W=1280,M=140;
var $=function(i){return document.getElementById(i)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(20260930),pick=function(a){return a[Math.floor(R()*a.length)]};
var BODY=["blob","arch","cube"],TONE=["pink","orange","yellow","green","teal","blue","violet","slate"];
var HAT=["none","tophat","crown","party","cowboy","wizard","chef","graduation","hardhat","antenna","flower"];
function look(){return{body:pick(BODY),tone:pick(TONE),hat:R()<.85?pick(HAT.slice(1)):"none",glasses:R()<.35?"shades":"none",accessory:R()<.5?pick(["bowtie","tie","mustache"]):"none"}}
var layer=$("layer"),D=[];
// lanes: [feet y, size, count]
var LANES=[[485,64,6],[540,84,6],[600,112,6],[668,158,5],[705,196,3]];
function add(o){
  var el=document.createElement("div");el.className="d";el.innerHTML=dotSprite(o.look,o.S,"Dot",BASE);
  var sh=document.createElement("div");sh.className="sh";
  o.el=el;o.sh=sh;o.z=o.feet+(o.z||0);D.push(o)}
// runners (periodic crossings)
LANES.forEach(function(L,li){for(var i=0;i<L[2];i++){
  var dir=R()<.5?-1:1,k=1+(R()<.3?1:0);
  add({kind:"run",feet:L[0]+Math.round((R()-.5)*8),S:Math.round(L[1]*(.9+R()*.25)),look:look(),dir:dir,k:k,x0:R()*(W+2*M),f:Math.round(10+R()*10),ph:R()*6.28})}});
// in-place jumpers on the tiles and mid roofs
for(var i=0;i<8;i++){var L=LANES[1+Math.floor(R()*4)];
  add({kind:"jump",feet:L[0]+Math.round((R()-.5)*10),S:Math.round(L[1]*(.95+R()*.2)),look:look(),x:80+R()*(W-160),n:1+Math.floor(R()*3),ph:R(),amp:70+R()*120})}
// sky arcs across the whole screen
for(var i=0;i<10;i++){var L=LANES[2+Math.floor(R()*3)];
  add({kind:"arc",feet:L[0],S:Math.round(L[1]*(.9+R()*.2)),look:look(),dir:R()<.5?-1:1,n:1+(R()<.4?1:0),ph:R(),amp:220+R()*230,spin:R()<.5?1:0,z:60})}
// fallers from the sky
for(var i=0;i<6;i++){var L=LANES[2+Math.floor(R()*3)];
  add({kind:"fall",feet:L[0]+Math.round((R()-.5)*8),S:Math.round(L[1]*(.9+R()*.2)),look:look(),x:120+R()*(W-240),t0:R()*T,dir:R()<.5?-1:1,z:30})}
// hero
add({kind:"hero",feet:690,S:250,look:{body:"blob",tone:"blue"},z:200});
D.sort(function(a,b){return a.z-b.z});
var BB=[],BT=["Hola!","Ja arribo!","✓✓","Missatge nou","Sóc aquí","Tinc idees","Bon dia!","Què necessites?","Ho miro!","Fet ✓"],bi=0,BS=[];
D.forEach(function(o){
  if(o.feet<560)o.el.style.filter="blur(1.6px) saturate(.9) brightness(1.06)";
  else o.el.style.filter="drop-shadow(0 0 14px rgba(255,190,110,.55))";
  layer.appendChild(o.sh);layer.appendChild(o.el);
  if(o.S>=100&&o.kind!=="arc"&&o.kind!=="fall"&&bi<9){var b=document.createElement("div");b.className="bb";b.textContent=BT[bi%BT.length];b.style.fontSize=Math.round(o.S*.15+8)+"px";BB.push(b);BS.push({o:o,b:b,n:1,ph:(bi*.37)%1});bi++}
});
var fx=$("fx"),SP=[],CF=[];BB.forEach(function(b){fx.appendChild(b)});
for(var i=0;i<46;i++){var e=document.createElement("div");e.className="sp";fx.appendChild(e);SP.push({e:e,x:R()*W,y0:R()*720,v:20+R()*60,ph:R()*6.28,sz:.5+R()*1.1})}
var CC=["#ff4d7d","#ffc21a","#2f7bff","#19c3a6","#7a4cf0","#ff8a3d","#7cd13b"];
for(var k=0;k<2;k++)for(var i=0;i<26;i++){var e=document.createElement("div");e.className="cf";e.style.background=CC[i%CC.length];fx.appendChild(e);var an=-Math.PI/2+(R()-.5)*2.6;var sp=260+R()*380;CF.push({e:e,k:k,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,rot:R()*360,rv:(R()-.5)*900})}
var TAU=Math.PI*2;
function place(o,x,lift,sx,sy,rot){
  var S=o.S,feet=o.feet-lift;
  o.el.style.transform="translate("+(x-S/2)+"px,"+(feet-S*.95)+"px) rotate("+(rot||0)+"deg) scale("+sx+","+sy+")";
  var k=1-Math.min(.65,Math.max(0,lift/(o.feet*.7)));var sw=S*.6*k;
  o.sh.style.width=sw+"px";o.sh.style.left=(x-sw/2)+"px";o.sh.style.top=(o.feet-S*.05)+"px";o.sh.style.opacity=.9*k;o.sh.style.height=Math.max(6,S*.09)+"px";
}
window.seek=function(t){
  $("bg").style.transform="scale("+(1.035+.02*Math.sin(TAU*t/T))+") translateX("+(Math.sin(TAU*t/T)*10)+"px)";
  D.forEach(function(o){
    var p=t/T,x,lift=0,sx=1,sy=1,rot=0;
    if(o.kind==="run"){
      var span=W+2*M,u=(o.x0+o.dir*span*o.k*p)%span;if(u<0)u+=span;x=u-M;
      var h=Math.abs(Math.sin(TAU*o.f*p/2+o.ph));lift=h*o.S*.16;sy=1-.05*(1-h);sx=1+.04*(1-h)
    }else if(o.kind==="jump"){
      x=o.x;var u=((p*o.n+o.ph)%1+1)%1;
      if(u<.15){var w=u/.15;sy=1-.16*Math.sin(w*Math.PI);sx=1+.1*Math.sin(w*Math.PI)}
      else if(u<.7){var w=(u-.15)/.55;lift=Math.sin(w*Math.PI)*o.amp;sy=1+.07*Math.sin(w*Math.PI);sx=1/sy}
      else if(u<.8){var w=(u-.7)/.1;sy=1-.12*Math.sin(w*Math.PI);sx=1+.08*Math.sin(w*Math.PI)}
    }else if(o.kind==="arc"){
      var u=((p*o.n+o.ph)%1+1)%1;x=(o.dir>0?-M+u*(W+2*M):W+M-u*(W+2*M));lift=Math.sin(Math.PI*Math.min(1,u))*o.amp;rot=o.spin?o.dir*u*360:o.dir*Math.sin(TAU*u)*14;sy=1.04;sx=.97
    }else if(o.kind==="fall"){
      var u=((t-o.t0)/T%1+1)%1,g=u/.9;x=o.x;
      if(u<.09){var k=u/.09;lift=o.feet+140-(1-k*k)*0+(-(k*k)*(o.feet+140));lift=(1-k*k)*(o.feet+140);sy=1.1;sx=.92}
      else if(u<.2){var w=(u-.09)/.11;lift=Math.abs(Math.sin(w*Math.PI*1.5))*Math.max(0,1-w)*130;var sq=.14*Math.max(0,1-w*3);sy=1-sq;sx=1+sq}
      else{var v=(u-.2)/.8;x=o.x+o.dir*v*(W+M);lift=Math.abs(Math.sin(v*TAU*7))*o.S*.16;if(x<-M||x>W+M)x=-999}
    }else{ // hero: big leap twice per loop, lands with squash
      x=W/2+Math.sin(TAU*p)*150;var u=((p*2)%1+1)%1;
      if(u<.14){var w=u/.14;sy=1-.2*Math.sin(w*Math.PI);sx=1+.13*Math.sin(w*Math.PI)}
      else if(u<.62){var w=(u-.14)/.48;lift=Math.sin(w*Math.PI)*330;sy=1+.08*Math.sin(w*Math.PI);sx=1/sy;rot=Math.sin(w*Math.PI)*(Math.floor(p*2)%2?-14:14)}
      else if(u<.75){var w=(u-.62)/.13;sy=1-.16*Math.sin(w*Math.PI);sx=1+.11*Math.sin(w*Math.PI)}
    }
    place(o,x,lift,sx,sy,rot);o.cx=x;o.cl=lift;
  });
  // chat bubbles
  BS.forEach(function(q){var u=((t/T*q.n+q.ph)%1+1)%1,on=u<.42;
    if(!on){q.b.style.opacity=0;return}
    var w=u/.42,a=w<.15?w/.15:(w>.85?(1-w)/.15:1),sc=w<.15?(.4+.6*(1-Math.pow(1-w/.15,3))):1;
    q.b.style.opacity=a;q.b.style.transform="translate("+(q.o.cx-8)+"px,"+(q.o.feet-q.o.cl-q.o.S*1.02-30)+"px) scale("+sc+")"});
  // sparkles
  SP.forEach(function(p){var y=((p.y0-p.v*t)%720+720)%720;var tw=.5+.5*Math.sin(TAU*t/T*3+p.ph);p.e.style.transform="translate("+(p.x+Math.sin(TAU*t/T*2+p.ph)*14)+"px,"+y+"px) scale("+p.sz+")";p.e.style.opacity=.15+.7*tw});
  // confetti on hero landings (2 per loop)
  var hero=D.filter(function(o){return o.kind==="hero"})[0];
  CF.forEach(function(c){var pl=(c.k+.62)/2,xl=W/2+Math.sin(TAU*pl)*150,age=((t/T-pl)%1+1)%1*T;
    if(age>1.7){c.e.style.opacity=0;return}
    var x=xl+c.vx*age,y=hero.feet-hero.S*.6+c.vy*age+.5*900*age*age;c.e.style.opacity=age<1.3?1:(1.7-age)/.4;
    c.e.style.transform="translate("+x+"px,"+y+"px) rotate("+(c.rot+c.rv*age)+"deg)"});
  $("sun").style.opacity=.82+.18*Math.sin(TAU*t/T*2);
};
Promise.all([].map.call(document.images,function(i){return i.decode?i.decode().catch(function(){}):Promise.resolve()})).then(function(){window.READY=true});
seek(0);
})();
</script></body></html>
