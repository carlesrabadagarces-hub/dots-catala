<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><title>superDOTats · teulades</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000}
#st{position:relative;width:1280px;height:720px;overflow:hidden;background:#000;font-family:"Helvetica Neue",Arial,sans-serif}
#bg{position:absolute;left:-60px;top:-32px;width:1400px;height:783px;transform-origin:50% 60%}
.d{position:absolute;left:0;top:0;transform-origin:50% 95%;will-change:transform}
.dsp-shadow{display:none}
.sh{position:absolute;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,20,0,.55),rgba(60,20,0,0))}
#tag{position:absolute;left:0;right:0;top:92px;text-align:center;color:#fff;text-shadow:0 4px 30px rgba(120,30,0,.6)}
#tag h2{margin:0;font-size:96px;font-weight:700;letter-spacing:-.05em;line-height:1}
#tag p{margin:10px 0 0;font-size:30px;font-weight:500;opacity:.92}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(0,0,0,0) 55%,rgba(40,10,0,.35) 100%);pointer-events:none}
</style></head><body>
<div id="st"><img id="bg" src="roofs-bg.jpg" alt=""><div id="vig"></div><div id="layer"></div>
<div id="tag"><h2>superDOTats</h2><p>Els teus agents, a tota Barcelona.</p></div><div id="fade"></div></div>
<script>
/*LIBS*/
(function(){
var BASE="../dots/";ensureSpriteStyles();
var $=function(i){return document.getElementById(i)},clamp=function(x,a,b){return Math.max(a,Math.min(b,x))},seg=function(t,a,b){return clamp((t-a)/(b-a),0,1)};
var easeOut=function(x){return 1-Math.pow(1-x,3)},easeIO=function(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
var LK=[
 {body:"blob",tone:"orange",hat:"hardhat",accessory:"mustache"},
 {body:"cube",tone:"pink",glasses:"shades",accessory:"tie"},
 {body:"arch",tone:"teal",hat:"chef"},
 {body:"blob",tone:"yellow",hat:"flower"},
 {body:"cube",tone:"violet",hat:"wizard"},
 {body:"arch",tone:"green",hat:"antenna"}
];
var HERO={body:"blob",tone:"blue"};
var GY=655; // feet line on the tile roof
var layer=$("layer"),D=[];
function mk(look,S,t0,speed,phase,x0){
  var el=document.createElement("div");el.className="d";el.innerHTML=dotSprite(look,S,"Dot",BASE);layer.appendChild(el);
  var sh=document.createElement("div");sh.className="sh";layer.insertBefore(sh,el);
  return {el:el,sh:sh,S:S,t0:t0,v:speed,ph:phase,x0:x0||-200};
}
LK.forEach(function(l,i){D.push(mk(l,150,.1+i*.55,230+i*14,i*1.7))});
var H=mk(HERO,210,3.0,0,0);
function place(o,x,yLift,sx,sy,op){
  var S=o.S,feet=GY-yLift;
  o.el.style.opacity=op;o.el.style.transform="translate("+(x-S/2)+"px,"+(feet-S*.95)+"px) scale("+sx+","+sy+")";
  var sw=S*.62*(1-clamp(yLift/380,0,.6));o.sh.style.opacity=op*(1-clamp(yLift/380,0,.7));
  o.sh.style.width=sw+"px";o.sh.style.left=(x-sw/2)+"px";o.sh.style.top=(GY-8)+"px";
}
window.seek=function(t){
  var z=1+.05*(t/8);$("bg").style.transform="scale("+z+") translateX("+(-t*3)+"px)";
  D.forEach(function(o,i){
    var u=t-o.t0;
    if(u<0){place(o,-300,0,1,1,0);return}
    var x=-90+o.v*u; // runs left to right
    // step hops
    var hop=Math.abs(Math.sin(u*7+o.ph))*22, sq=1+.06*Math.cos(u*14+o.ph*2);
    // gap jump over the chimneys
    var gx=[430,860][i%2], gd=260, lift=0;
    if(x>gx-gd/2&&x<gx+gd/2){var k=(x-(gx-gd/2))/gd;lift=Math.sin(k*Math.PI)*(120+i*14);hop=0}
    var s=lift>0?1.05:1/sq;
    var op=x>1400?0:1;
    place(o,x,hop+lift,sq,s,op);
  });
  // hero: enters, waits, mega leap, lands, hops
  var u=t-H.t0,x=640,lift=0,sx=1,sy=1,op=u<0?0:1;
  if(u>=0&&u<1.3){var k=easeOut(u/1.3);x=-150+k*(560+150);lift=Math.abs(Math.sin(u*8))*26*(1-k*.5)}
  else if(u>=1.3&&u<1.9){x=560;var w=(u-1.3)/.6;sy=1-.14*Math.sin(w*Math.PI);sx=1+.1*Math.sin(w*Math.PI)} // crouch
  else if(u>=1.9&&u<3.1){var k=(u-1.9)/1.2;x=560+k*160;lift=Math.sin(k*Math.PI)*330;sy=1+.08*Math.sin(k*Math.PI);sx=1/sy}
  else if(u>=3.1){x=720;var w=u-3.1;lift=Math.abs(Math.sin(w*7))*Math.max(0,1-w/1.1)*40;if(w<.18){sy=.88+.12*(w/.18);sx=1.1-.1*(w/.18)}}
  place(H,x,lift,sx,sy,op);
  // text
  var ta=easeOut(seg(t,5.6,6.6));$("tag").style.opacity=ta;$("tag").style.transform="translateY("+(1-ta)*22+"px)";
  // fades
  var f=1-seg(t,0,.6);var g=seg(t,7.4,8.0);$("fade").style.opacity=Math.max(f,g);
};
Promise.all([].map.call(document.images,function(i){return i.decode?i.decode().catch(function(){}):Promise.resolve()})).then(function(){window.READY=true});
seek(0);
})();
</script></body></html>
