# superDOTats on a server: docker compose up -d --build
# Copy .env.example to .env and fill it in first. See docs/DEPLOY.md.
services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      FRONTEND_URL: https://${APP_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN}
      AUTH_COOKIE_SECURE: "1"
      ALLOW_LOCAL_LOGIN: "0"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Posa ADMIN_PASSWORD al fitxer .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SIGNUP_OPEN: ${SIGNUP_OPEN:-1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-}
      MODEL_WIRE_API: ${MODEL_WIRE_API:-chat}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openai/gpt-oss-20b}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/auth/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build: ./client
    restart: unless-stopped
    depends_on: [api]

  caddy:
    build:
      context: .
      dockerfile: deploy/site.Dockerfile
      args:
        SITE_URL: https://${SITE_DOMAIN}
        APP_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Posa SITE_DOMAIN al fitxer .env}
      APP_DOMAIN: ${APP_DOMAIN:?Posa APP_DOMAIN al fitxer .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]

volumes:
  data:
  caddy_data:
  caddy_config:
